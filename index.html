<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Skills — Challenges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background-default: #111111;
      --background-subtitle: #252525;
      --text-primary: #efeff1;
      --text-secondary: rgba(239, 239, 241, 0.6);
      --button-white-bg: #efeff1;
      --button-white-text: #111111;
      --accent-cyan: #3cd3fe;
      --vibrant-tertiary: #121212;
      --label-vibrant: #f5f5f5;
      --hero-green: #136458;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #111111;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      padding: 0 0;
      background: #111111;
      min-height: 100vh;
    }

    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      background: var(--background-default);
      overflow: hidden;
    }

    @media (max-width: 500px) {
      body { padding: 0; min-height: 100vh; background: var(--background-default); }
      .phone {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ----- Main scrollable content ----- */
    .content {
      position: absolute;
      inset: 0;
      padding: 24px 16px 130px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }
    .content > * + * { margin-top: 24px; }

    /* ----- Leagues progress ----- */
    .leagues-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 358px;
      padding: 16px;
      background: var(--background-subtitle);
      border-radius: 16px;
      overflow: hidden;
    }
    .leagues-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      height: 33px;
    }
    .leagues-body p {
      font-size: 14px;
      line-height: 21px;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .progress-bar {
      height: 6px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar .fill {
      position: absolute;
      left: 0;
      bottom: -0.5px;
      height: 6px;
      width: 0%;
      background: #ffffff;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-bar .fill.no-anim {
      transition: none;
    }
    .league-badge {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      transform-origin: center;
    }
    .league-badge img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    .league-badge.is-leveling-up {
      animation: leagueLevelUp 1000ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes leagueLevelUp {
      0%   { transform: scale(1)   rotate(0deg); }
      50%  { transform: scale(1.7) rotate(180deg); }
      100% { transform: scale(1)   rotate(360deg); }
    }

    /* ----- Sections ----- */
    .challenges-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 358px;
    }
    .challenges-section[hidden] {
      display: none;
    }
    .challenges-section.last {
      padding-bottom: 24px;
    }
    #completed-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    #completed-list[hidden],
    .empty-card[hidden] {
      display: none;
    }
    .empty-card {
      width: 100%;
      padding: 16px;
      background: var(--background-subtitle);
      border-radius: 16px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 21px;
      text-align: center;
    }
    .section-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .section-title {
      font-weight: 700;
      font-size: 24px;
      line-height: 1.35;
      color: var(--text-primary);
    }
    .section-subtitle {
      font-size: 14px;
      line-height: 21px;
      color: var(--text-secondary);
    }

    /* ----- Hero (daily) challenge card ----- */
    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 358px;
    }
    .hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 16px 20px;
      background: var(--hero-green);
      border-radius: 16px;
      overflow: hidden;
      transition: background 0.3s ease;
    }
    .hero-card.is-completed .hero-inner {
      background: var(--background-subtitle);
    }
    .hero-timer {
      background: #000000
      display: none;
      width: 100%;
      padding: 8px 16px;
      font-size: 16px;
      line-height: 21px;
      color: var(--text-primary);
      text-align: center;
      margin: 0;
    }
    .hero-card.is-completed .hero-timer {
      display: block;
    }
    .hero-timer-label {
      color: var(--text-secondary);
    }
    .hero-mascot {
      position: relative;
      width: 175px;
      height: 186px;
      overflow: hidden;
      border-radius: 8px;
      background: #38393b;
      flex-shrink: 0;
      transition: width 0.3s ease, height 0.3s ease;
    }
    .hero-mascot img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hero-title {
      font-weight: 700;
      font-size: 28px;
      line-height: 36px;
      color: var(--text-primary);
      text-align: center;
      margin: 0;
      width: 100%;
    }
    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      padding: 14px 18px;
      background: var(--button-white-bg);
      color: var(--button-white-text);
      font-weight: 600;
      font-size: 16px;
      line-height: 16px;
      border-radius: 1000px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.3s ease;
    }

    /* Completed state */
    .hero-card.is-completed .hero-mascot {
      width: 60px;
      height: 64px;
    }
    .hero-card.is-completed .hero-title {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-skip-ink: none;
    }
    .hero-card.is-completed .hero-button {
      opacity: 0.4;
      cursor: default;
    }

    /* ----- Completed-this-week cards ----- */
    .completed-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 358px;
      padding: 16px;
      background: var(--background-subtitle);
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-primary);
      text-align: left;
      overflow: hidden;
    }
    .completed-icon {
      width: 30px;
      height: 32px;
      flex-shrink: 0;
      display: block;
      border-radius: 4px;
      background: #38393b;
    }
    .completed-icon img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }
    .completed-text {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      line-height: 21px;
      color: var(--text-primary);
    }

  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="Skills app preview">

    <main class="content">

      <!-- Leagues progress -->
      <div class="leagues-card" aria-label="League progress">
        <div class="leagues-body">
          <p id="progress-label"></p>
          <div class="progress-bar" aria-label="Lessons until next league">
            <div class="fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="league-badge" id="league-badge" aria-hidden="true">
          <img id="league-img" src="assets/challenges/leagues/league-1.png" alt="" />
        </div>
      </div>

      <!-- Daily challenge -->
      <section class="challenges-section" aria-label="Daily challenge">
        <div class="section-text">
          <h2 class="section-title">Daily challenge</h2>
          <p class="section-subtitle">Based on the last completed lessons</p>
        </div>
        <article class="hero-card" id="hero-card">
          <div class="hero-inner">
            <div class="hero-mascot" aria-hidden="true">
              <img id="hero-mascot-img" src="" alt="" />
            </div>
            <h3 class="hero-title" id="hero-title"></h3>
            <button class="hero-button" type="button" id="hero-toggle">Completed</button>
          </div>
          <p class="hero-timer" id="hero-timer" aria-live="polite">
            <span class="hero-timer-label">Next challenge in</span>
            <span class="hero-timer-value" id="hero-timer-value">00:00:00</span>
          </p>
        </article>
      </section>

      <!-- Completed this week -->
      <section class="challenges-section last" aria-label="Completed this week">
        <div class="section-text">
          <h2 class="section-title">Completed this week</h2>
          <p class="section-subtitle">Something you can be proud of</p>
        </div>
        <div id="completed-list"></div>
        <div id="completed-empty" class="empty-card" hidden>
          Nothing this week yet. One small step can make a difference
        </div>
      </section>
    </main>

  </div>

  <script>
    const heroCard         = document.getElementById('hero-card');
    const heroToggle       = document.getElementById('hero-toggle');
    const heroTitle        = document.getElementById('hero-title');
    const heroMascotImg    = document.getElementById('hero-mascot-img');
    const progressFill     = document.getElementById('progress-fill');
    const progressLabel    = document.getElementById('progress-label');
    const leagueBadge      = document.getElementById('league-badge');
    const leagueImg        = document.getElementById('league-img');
    const completedList    = document.getElementById('completed-list');
    const completedEmpty   = document.getElementById('completed-empty');
    const heroTimerValue   = document.getElementById('hero-timer-value');

    const MAX_LEAGUE = 5;
    const LESSONS_PER_LEAGUE = 5;
    let state = null;
    let animating = false;
    let timerInterval = null;

    function clampLeague(l) { return Math.min(Math.max(l, 1), MAX_LEAGUE); }

    function paintLeague() {
      leagueImg.src = `assets/challenges/leagues/league-${clampLeague(state.league)}.png`;
    }

    function paintProgress() {
      const pct = (state.progress / LESSONS_PER_LEAGUE) * 100;
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `${state.progress}/${LESSONS_PER_LEAGUE} lessons to next league`;
    }

    function paintHero() {
      heroTitle.textContent = state.todayChallenge.title;
      heroMascotImg.src = `assets/challenges/lessons/${state.todayChallenge.mascot}`;
      heroCard.classList.toggle('is-completed', state.completedToday);
      if (state.completedToday) startTimer(); else stopTimer();
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function nycHmsNow() {
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false,
      });
      let h = 0, m = 0, s = 0;
      for (const p of fmt.formatToParts(new Date())) {
        if (p.type === 'hour') h = parseInt(p.value, 10);
        else if (p.type === 'minute') m = parseInt(p.value, 10);
        else if (p.type === 'second') s = parseInt(p.value, 10);
      }
      if (h === 24) h = 0; // some locales report midnight as 24
      return { h, m, s };
    }

    function paintTimer() {
      const { h, m, s } = nycHmsNow();
      const remaining = 86400 - (h * 3600 + m * 60 + s);
      if (remaining <= 0) {
        heroTimerValue.textContent = '00:00:00';
        stopTimer();
        refreshState();
        return;
      }
      const hh = Math.floor(remaining / 3600);
      const mm = Math.floor((remaining % 3600) / 60);
      const ss = remaining % 60;
      heroTimerValue.textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
    }

    function startTimer() {
      if (timerInterval) return;
      paintTimer();
      timerInterval = setInterval(paintTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    async function refreshState() {
      try {
        const fresh = await fetchState();
        state = fresh;
        paintAll();
      } catch (e) {
        console.error('refresh failed', e);
      }
    }

    function paintCompletedList() {
      completedList.innerHTML = '';
      for (const item of state.completedThisWeek) {
        const btn = document.createElement('button');
        btn.className = 'completed-card';
        btn.type = 'button';
        const icon = document.createElement('span');
        icon.className = 'completed-icon';
        const img = document.createElement('img');
        img.alt = '';
        img.src = `assets/challenges/lessons/${item.mascot}`;
        icon.appendChild(img);
        const text = document.createElement('span');
        text.className = 'completed-text';
        text.textContent = item.title;
        btn.appendChild(icon);
        btn.appendChild(text);
        completedList.appendChild(btn);
      }
      const isEmpty = state.completedThisWeek.length === 0;
      completedList.hidden = isEmpty;
      completedEmpty.hidden = !isEmpty;
    }

    function paintAll() {
      paintHero();
      paintCompletedList();
      paintProgress();
      paintLeague();
    }

    async function fetchState() {
      const r = await fetch('/api/state', { cache: 'no-store' });
      return r.json();
    }
    async function postToggle(complete) {
      const r = await fetch(complete ? '/api/complete' : '/api/uncomplete', { method: 'POST' });
      return r.json();
    }

    function levelUp(newState) {
      animating = true;
      // Bar fills to 100% first, then league badge spins.
      setTimeout(() => {
        leagueBadge.classList.add('is-leveling-up');
        setTimeout(() => {
          state.league = newState.league;
          paintLeague();
        }, 500);
        setTimeout(() => {
          leagueBadge.classList.remove('is-leveling-up');
          state = newState;
          progressFill.classList.add('no-anim');
          paintProgress();
          paintCompletedList();
          requestAnimationFrame(() => {
            requestAnimationFrame(() => progressFill.classList.remove('no-anim'));
          });
          animating = false;
        }, 1000);
      }, 450);
    }

    function levelDown(newState) {
      animating = true;
      leagueBadge.style.animationDirection = 'reverse';
      leagueBadge.classList.add('is-leveling-up');
      setTimeout(() => {
        state.league = newState.league;
        paintLeague();
        state.progress = newState.progress;
        progressFill.classList.add('no-anim');
        paintProgress();
        paintCompletedList();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => progressFill.classList.remove('no-anim'));
        });
      }, 500);
      setTimeout(() => {
        leagueBadge.classList.remove('is-leveling-up');
        leagueBadge.style.animationDirection = '';
        state = newState;
        animating = false;
      }, 1000);
    }

    heroToggle.addEventListener('click', async () => {
      if (animating) return;
      const wasCompleted = state.completedToday;
      const oldLeague = state.league;
      let newState;
      try {
        newState = await postToggle(!wasCompleted);
      } catch (e) {
        console.error('toggle failed', e);
        return;
      }

      if (!wasCompleted && newState.league > oldLeague) {
        // Level up: keep bar at 5/5 briefly, animate badge, then snap to new league.
        state.completedToday = true;
        state.progress = LESSONS_PER_LEAGUE;
        heroCard.classList.add('is-completed');
        startTimer();
        paintProgress();
        levelUp(newState);
      } else if (wasCompleted && newState.league < oldLeague) {
        state.completedToday = false;
        heroCard.classList.remove('is-completed');
        stopTimer();
        levelDown(newState);
      } else {
        state = newState;
        paintAll();
      }
    });

    (async () => {
      try {
        state = await fetchState();
        paintAll();
      } catch (e) {
        console.error('initial fetch failed', e);
      }
    })();
  </script>
</body>
</html>
